[project]
name = "regenmed-reviewer"
version = "0.1.0"
description = "Internal Document Reviewer for RegenMed hand-filled processing forms"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls the Gemini API (needs GEMINI_API_KEY)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
